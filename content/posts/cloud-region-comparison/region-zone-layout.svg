<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Two regions, each containing three zones">
  <rect width="960" height="360" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#17212b">
    <text x="32" y="42" font-size="22" font-weight="700">Regions and Availability Zones</text>
    <text x="32" y="70" font-size="15" fill="#475569">Conceptual layout: zone counts depend on the provider and region.</text>
    <rect x="32" y="96" width="432" height="214" rx="8" fill="#ffffff" stroke="#256b83" stroke-width="2"/>
    <rect x="496" y="96" width="432" height="214" rx="8" fill="#ffffff" stroke="#55724a" stroke-width="2"/>
    <text x="56" y="134" font-size="21" font-weight="700" fill="#256b83">Region A</text>
    <text x="520" y="134" font-size="21" font-weight="700" fill="#55724a">Region B</text>
    <g fill="#e9f3f6" stroke="#256b83">
      <rect x="56" y="160" width="112" height="108" rx="6"/>
      <rect x="192" y="160" width="112" height="108" rx="6"/>
      <rect x="328" y="160" width="112" height="108" rx="6"/>
    </g>
    <g fill="#eef3e9" stroke="#55724a">
      <rect x="520" y="160" width="112" height="108" rx="6"/>
      <rect x="656" y="160" width="112" height="108" rx="6"/>
      <rect x="792" y="160" width="112" height="108" rx="6"/>
    </g>
    <g font-size="18" text-anchor="middle">
      <text x="112" y="207">Zone 1</text><text x="248" y="207">Zone 2</text><text x="384" y="207">Zone 3</text>
      <text x="576" y="207">Zone 1</text><text x="712" y="207">Zone 2</text><text x="848" y="207">Zone 3</text>
    </g>
    <g font-size="14" text-anchor="middle" fill="#475569">
      <text x="112" y="237">VM / DB</text><text x="248" y="237">VM / DB</text><text x="384" y="237">VM / DB</text>
      <text x="576" y="237">VM / DB</text><text x="712" y="237">VM / DB</text><text x="848" y="237">VM / DB</text>
    </g>
    <text x="480" y="338" font-size="15" text-anchor="middle" fill="#475569">Multi-zone: within a region / Multi-region: across regions</text>
  </g>
</svg>
