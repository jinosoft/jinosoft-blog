<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title desc">
  <title id="title">One server with a combined Kafka node</title>
  <desc id="desc">Server S1 contains Broker B1 and Controller C1. One host failure affects both roles.</desc>
  <rect width="480" height="240" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="20" width="432" height="160" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="240" y="57" font-size="25" font-weight="700" fill="#111827">Server S1</text>
    <rect x="44" y="82" width="188" height="64" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="138" y="122" font-size="23" fill="#075985">Broker B1</text>
    <rect x="248" y="82" width="188" height="64" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="342" y="122" font-size="22" fill="#166534">Controller C1</text>
    <text x="240" y="215" font-size="21" fill="#991b1b">One host = one failure domain</text>
  </g>
</svg>
