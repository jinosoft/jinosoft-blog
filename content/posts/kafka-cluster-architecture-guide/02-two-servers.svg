<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Two combined Kafka servers</title>
  <desc id="desc">S1 has B1 and C1. S2 has B2 and C2. Both controllers are required for a majority of two.</desc>
  <rect width="480" height="360" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="16" width="432" height="130" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="240" y="49" font-size="25" font-weight="700" fill="#111827">Server S1</text>
    <rect x="44" y="68" width="188" height="55" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="138" y="103" font-size="23" fill="#075985">Broker B1</text>
    <rect x="248" y="68" width="188" height="55" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="342" y="103" font-size="22" fill="#166534">Controller C1</text>
    <rect x="24" y="166" width="432" height="130" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="240" y="199" font-size="25" font-weight="700" fill="#111827">Server S2</text>
    <rect x="44" y="218" width="188" height="55" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="138" y="253" font-size="23" fill="#075985">Broker B2</text>
    <rect x="248" y="218" width="188" height="55" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="342" y="253" font-size="22" fill="#166534">Controller C2</text>
    <text x="240" y="337" font-size="23" fill="#991b1b">Controller majority: 2 of 2</text>
  </g>
</svg>
