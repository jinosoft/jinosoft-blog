<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600" role="img" aria-labelledby="title desc">
  <title id="title">Add a broker-only fourth server to three combined nodes</title>
  <desc id="desc">S1 S2 S3 each keep a combined broker and controller process. New server S4 runs Broker B4 only. Four brokers and three controllers remain. Existing partitions need reassignment.</desc>
  <rect width="480" height="600" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="16" width="432" height="116" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="240" y="49" font-size="24" font-weight="700" fill="#111827">Server S1 (existing)</text>
    <text x="240" y="87" font-size="23" fill="#075985">Broker B1 + Controller C1</text>
    <text x="240" y="115" font-size="19" fill="#374151">One combined Kafka process</text>
    <rect x="24" y="148" width="432" height="116" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="240" y="181" font-size="24" font-weight="700" fill="#111827">Server S2 (existing)</text>
    <text x="240" y="219" font-size="23" fill="#075985">Broker B2 + Controller C2</text>
    <text x="240" y="247" font-size="19" fill="#374151">One combined Kafka process</text>
    <rect x="24" y="280" width="432" height="116" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="240" y="313" font-size="24" font-weight="700" fill="#111827">Server S3 (existing)</text>
    <text x="240" y="351" font-size="23" fill="#075985">Broker B3 + Controller C3</text>
    <text x="240" y="379" font-size="19" fill="#374151">One combined Kafka process</text>
    <rect x="24" y="412" width="432" height="116" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="240" y="445" font-size="24" font-weight="700" fill="#075985">Server S4 (new)</text>
    <text x="240" y="483" font-size="23" fill="#075985">Broker B4 only</text>
    <text x="240" y="511" font-size="19" fill="#374151">process.roles=broker</text>
    <text x="240" y="570" font-size="24" font-weight="700" fill="#111827">4 brokers / 3 controllers</text>
  </g>
</svg>
